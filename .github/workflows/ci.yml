name: Validate and package

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { react: "locked", node: 22 }
          - { react: "18.2.0", node: 24 }
          - { react: "locked", node: 24 }
          - { react: "locked", node: 26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.react == '18.2.0'
        run: npm install --no-save --package-lock=false --ignore-scripts react@18.2.0 react-dom@18.2.0
      - run: npm run typecheck && npm run lint && npm run format:check
      - run: npm test
      - run: npm run audit && npm audit --omit=dev
      - if: matrix.react == 'locked' && matrix.node == 24
        run: npm audit signatures
      - run: npm run check:package
        env:
          CHECK_NEXT: ${{ matrix.react == 'locked' && matrix.node == 24 && '1' || '0' }}

  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: chromium
            browser: chrome
            channel: chrome
          - os: ubuntu-latest
            project: chromium
            browser: msedge
            channel: msedge
          - os: ubuntu-latest
            project: firefox
            browser: firefox
            channel: ""
          - os: macos-latest
            project: native
            browser: webkit
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_NATIVE_HLS: "1"
      PLAYWRIGHT_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - run: npm run fixtures
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser:${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: test-results
          if-no-files-found: error
          overwrite: true

  candidate:
    if: github.event_name == 'workflow_dispatch' || inputs.candidate
    needs: [package, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm pack && npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate
          if-no-files-found: error
          overwrite: true
          path: |
            *.tgz
            sbom.cdx.json
