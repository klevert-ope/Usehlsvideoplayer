name: Validate and package

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      matrix:
        include:
          - { react: "locked", node: 22 }
          - { react: "18.2.0", node: 24 }
          - { react: "locked", node: 24 }
          - { react: "locked", node: 26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - if: matrix.react == '18.2.0'
        run: npm install --no-save --package-lock=false --ignore-scripts --prefer-offline --no-audit --no-fund react@18.2.0 react-dom@18.2.0
      - if: matrix.react == 'locked' && matrix.node == 24
        run: npm run typecheck && npm run lint && npm run format:check
      - run: npm test
      - if: matrix.react == 'locked' && matrix.node == 24
        run: npm audit --omit=dev --audit-level=moderate && npm run audit:ci && npm audit signatures
      - run: npm run check:package
        env:
          CHECK_NEXT: ${{ matrix.react == 'locked' && matrix.node == 24 && '1' || '0' }}

  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: media-cache
        with:
          path: public/fixtures
          key: hls-fixtures-noble-v1-${{ hashFiles('scripts/fixtures.mjs') }}
      - if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install FFmpeg
        if: steps.media-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sources="$RUNNER_TEMP/ffmpeg.sources"
            sed -E 's@https?://[^ ]*ec2\.archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' \
              /etc/apt/sources.list.d/ubuntu.sources > "$sources"
            apt_options=(-o Dir::Etc::sourcelist="$sources" -o Dir::Etc::sourceparts=-
                         -o Acquire::Retries=2 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
            sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
      - if: steps.media-cache.outputs.cache-hit != 'true'
        run: node scripts/fixtures.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: playback-fixtures
          path: public/fixtures
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  browser:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chrome
            channel: chrome
          - project: chromium
            browser: msedge
            channel: msedge
          - project: firefox
            browser: firefox
            channel: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PLAYWRIGHT_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 1
        with:
          name: playback-fixtures
          path: public/fixtures
      - if: matrix.browser == 'firefox'
        timeout-minutes: 2
        run: node node_modules/@playwright/test/cli.js install firefox
      - name: Run browser tests
        id: browser-tests
        run: node node_modules/@playwright/test/cli.js test --project=${{ matrix.project }} --workers=2
      - if: ${{ !cancelled() && (steps.browser-tests.outcome == 'failure' || (github.event_name == 'workflow_dispatch' && steps.browser-tests.outcome == 'success')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: test-results
          if-no-files-found: error
          overwrite: true

  candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: [package, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - run: npm pack && npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate
          if-no-files-found: error
          overwrite: true
          path: |
            *.tgz
            sbom.cdx.json
