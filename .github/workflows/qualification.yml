name: Extended playback qualification

on:
  push:
    branches: [qualification/playback-candidate]
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 0"

permissions:
  contents: read

concurrency:
  group: playback-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/qualification/playback-candidate'
    name: soak-${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        minutes: ${{ fromJSON(github.ref == 'refs/heads/master' && '[30, 360, 1440]' || '[30]') }}
    runs-on: ${{ matrix.minutes == 30 && 'ubuntu-latest' || 'hls-soak' }}
    timeout-minutes: ${{ matrix.minutes == 30 && 55 || matrix.minutes == 360 && 390 || 1500 }}
    env:
      SOAK_MINUTES: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.minutes == 30
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run fixtures
      - if: matrix.minutes == 30
        run: npx playwright install --with-deps chromium
      - if: matrix.minutes != 30
        run: npx playwright install chromium
      - run: npm run test:soak
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-${{ matrix.minutes }}
          path: test-results/soak/**/samples.ndjson
          if-no-files-found: error

  devices:
    if: github.ref == 'refs/heads/master'
    name: device-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios, android]
    runs-on: [self-hosted, "hls-device-${{ matrix.platform }}"]
    timeout-minutes: 25
    env:
      DEVICE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run fixtures
      - run: node scripts/device-check.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-${{ matrix.platform }}
          path: test-results/device/*.json
          if-no-files-found: error
